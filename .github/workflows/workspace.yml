name: Workspace

on:
  push:
    branches: [mono-repo-multi-tenent]
  pull_request:
    branches: [mono-repo-multi-tenent]
  workflow_dispatch:

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solar_e5
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solar_e5"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      RLS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Provision isolated Postgres 16 roles
        env:
          PGPASSWORD: postgres
        run: |
          export APP_OWNER_PASSWORD=$(openssl rand -hex 24)
          export APP_RUNTIME_PASSWORD=$(openssl rand -hex 24)
          export APP_PLATFORM_PASSWORD=$(openssl rand -hex 24)
          SEED_PASSWORD=$(openssl rand -hex 24)
          for value in "$APP_OWNER_PASSWORD" "$APP_RUNTIME_PASSWORD" "$APP_PLATFORM_PASSWORD" "$SEED_PASSWORD"; do echo "::add-mask::$value"; done
          psql -h localhost -U postgres -d solar_e5 -v ON_ERROR_STOP=1 -f packages/db/scripts/provision-roles.sql
          {
            echo "MIGRATION_DATABASE_URL=postgresql://app_owner:$APP_OWNER_PASSWORD@localhost:5432/solar_e5"
            echo "DATABASE_URL=postgresql://app_runtime:$APP_RUNTIME_PASSWORD@localhost:5432/solar_e5"
            echo "PLATFORM_DATABASE_URL=postgresql://app_platform:$APP_PLATFORM_PASSWORD@localhost:5432/solar_e5"
            echo "TEST_OWNER_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/solar_e5"
            echo "SEED_PASSWORD=$SEED_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: pnpm --filter @solar/db db:deploy
      # db:seed generates the client and syncs plans before seeding tenants.
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: pnpm --filter @solar/db test
      - run: pnpm --filter web test:tenant
      - run: pnpm --filter @solar/visual exec playwright install --with-deps chromium
      - run: pnpm --filter @solar/visual exec playwright test --config playwright.tenant.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-browser-evidence
          path: tooling/visual/test-results/tenant
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # PR: chỉ package đổi so với base + package phụ thuộc vào chúng. Push/dispatch: toàn repo (làm ấm cache).
      TURBO_FILTER: ${{ github.event_name == 'pull_request' && format('--filter=...[origin/{0}]', github.base_ref) || '' }}
      # Remote cache tùy chọn: đặt secret TURBO_TOKEN + variable TURBO_TEAM; để trống thì dùng cache .turbo/cache.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: node --version
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm plans:table --check
      - run: node --test scripts/ci/affected.test.mjs
      - name: Typecheck and lint (populate cache)
        run: pnpm turbo run typecheck lint lint:root ${TURBO_FILTER:+"$TURBO_FILTER"}
      - name: Typecheck and lint (verify FULL TURBO)
        run: |
          output=$(pnpm turbo run typecheck lint lint:root ${TURBO_FILTER:+"$TURBO_FILTER"} 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          # PR không đụng package nào thì turbo không có task để chạy.
          grep -qE 'FULL TURBO|No tasks were executed' <<< "$output" || {
            echo '::error::The second run must hit the cache for every task.'
            exit 1
          }
      - run: pnpm lint:tokens ${TURBO_FILTER:+"$TURBO_FILTER"}
      - run: pnpm turbo run test build ${TURBO_FILTER:+"$TURBO_FILTER"}
      - name: Core coverage (at least 85% of source lines)
        run: pnpm --filter @solar/core test:coverage
