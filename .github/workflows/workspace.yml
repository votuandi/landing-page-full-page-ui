name: Workspace

on:
  push:
    branches: [mono-repo-multi-tenent]
  pull_request:
    branches: [mono-repo-multi-tenent]
  workflow_dispatch:

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solar_e5
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solar_e5"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      RLS_REQUIRED: "1"
      E2E_PLATFORM_DOMAIN: solar.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/db-setup
      # Second seed proves the seed is idempotent.
      - run: pnpm db:seed
      - run: pnpm --filter @solar/db test
      - run: pnpm --filter web test:tenant
      - name: Resolve same-site preview and admin hosts in all browser engines
        run: |
          for host in preview-e5-t15 preview-e5-t12 preview-e5-t15.preview preview-e5-t12.preview preview-e5-t15.admin admin-e7-a admin-e7-a.preview admin-e7-a.admin admin-e7-b.admin nang-luong-solar.admin admin-e7-paused.admin missing.admin; do
            echo "127.0.0.1 $host.$E2E_PLATFORM_DOMAIN" | sudo tee -a /etc/hosts
          done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @solar/visual exec playwright install --with-deps chromium webkit firefox
      - run: pnpm --filter @solar/visual exec playwright test --config playwright.tenant.config.ts
      - run: pnpm --filter @solar/visual exec playwright test --config playwright.preview.config.ts
      - name: Build tenant production app once
        run: pnpm --filter web build
        env:
          MULTI_TENANT: "1"
      - name: Verify production cache invalidation, isolation, preview and reveal
        run: pnpm --filter @solar/visual exec playwright test --config playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-browser-evidence
          path: |
            tooling/visual/test-results/tenant
            tooling/visual/test-results/preview
            tooling/visual/test-results/production
  # Tách khỏi `db` để chạy song song (job `db` trước đây ~17 phút tuần tự).
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solar_e5
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solar_e5"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      RLS_REQUIRED: "1"
      E2E_PLATFORM_DOMAIN: solar.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/db-setup
      - run: pnpm --filter admin test
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @solar/visual exec playwright install --with-deps chromium
      - run: pnpm --filter @solar/visual exec playwright test --config playwright.admin.config.ts --project chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-evidence
          path: tooling/visual/test-results/admin
  verify:
    strategy:
      fail-fast: false
      matrix:
        # PR: chỉ Ubuntu (nhanh); Windows chạy khi push lên base để giữ AC đa nền tảng.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # PR: chỉ package đổi so với base + package phụ thuộc vào chúng. Push/dispatch: toàn repo (làm ấm cache).
      TURBO_FILTER: ${{ github.event_name == 'pull_request' && format('--filter=...[origin/{0}]', github.base_ref) || '' }}
      # Remote cache tùy chọn: đặt secret TURBO_TOKEN + variable TURBO_TEAM; để trống thì dùng cache .turbo/cache.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: node --version
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm plans:table --check
      - run: node --test scripts/ci/affected.test.mjs scripts/ci/checks-map.test.mjs
      - name: Typecheck and lint (populate cache)
        run: pnpm turbo run typecheck lint lint:root ${TURBO_FILTER:+"$TURBO_FILTER"}
      - name: Typecheck and lint (verify FULL TURBO)
        run: |
          output=$(pnpm turbo run typecheck lint lint:root ${TURBO_FILTER:+"$TURBO_FILTER"} 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          # PR không đụng package nào thì turbo không có task để chạy.
          grep -qE 'FULL TURBO|No tasks were executed' <<< "$output" || {
            echo '::error::The second run must hit the cache for every task.'
            exit 1
          }
      - run: pnpm lint:tokens ${TURBO_FILTER:+"$TURBO_FILTER"}
      - run: pnpm turbo run test build ${TURBO_FILTER:+"$TURBO_FILTER"}
      - name: Core coverage (at least 85% of source lines)
        run: pnpm --filter @solar/core test:coverage
