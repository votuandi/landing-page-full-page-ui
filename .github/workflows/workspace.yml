name: Workspace

on:
  push:
    branches: [mono-repo-multi-tenent]
  pull_request:
    branches: [mono-repo-multi-tenent]
  workflow_dispatch:

jobs:
  # Phạm vi kiểm của PR (scripts/ci/checks-map.mjs, cùng bảng với /run-story): story thường chỉ chạy unit/int của package
  # bị ảnh hưởng + test e2e mới/sửa của story; story regression (nhãn `regression`) hoặc chạy tay → toàn bộ.
  # Push lên base không chạy lại db/admin: PR đã kiểm trên đúng code đó.
  changes:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.map.outputs.db }}
      storage: ${{ steps.map.outputs.storage }}
      admin: ${{ steps.map.outputs.admin }}
      admin_e2e: ${{ steps.map.outputs.admin_e2e }}
      admin_grep: ${{ steps.map.outputs.admin_grep }}
      admin_files: ${{ steps.map.outputs.admin_files }}
      tenant_e2e: ${{ steps.map.outputs.tenant_e2e }}
      tenant_grep: ${{ steps.map.outputs.tenant_grep }}
      tenant_files: ${{ steps.map.outputs.tenant_files }}
      turnstile_e2e: ${{ steps.map.outputs.turnstile_e2e }}
      turnstile_grep: ${{ steps.map.outputs.turnstile_grep }}
      turnstile_files: ${{ steps.map.outputs.turnstile_files }}
      preview_e2e: ${{ steps.map.outputs.preview_e2e }}
      preview_grep: ${{ steps.map.outputs.preview_grep }}
      preview_files: ${{ steps.map.outputs.preview_files }}
      production_e2e: ${{ steps.map.outputs.production_e2e }}
      production_grep: ${{ steps.map.outputs.production_grep }}
      production_files: ${{ steps.map.outputs.production_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: map
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
          FULL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'regression') }}
        run: |
          args=(); [ "$FULL" = true ] && args=(--full)
          node scripts/ci/checks-map.mjs "$BASE" --github-output "${args[@]}"
  storage:
    needs: changes
    if: needs.changes.outputs.storage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STORAGE_REQUIRE_S3: "1"
      STORAGE_S3_TEST_ENDPOINT: http://127.0.0.1:59000
      STORAGE_S3_TEST_BUCKET: solar-storage-test
      STORAGE_S3_TEST_ACCESS_KEY_ID: minioadmin
      STORAGE_S3_TEST_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO and wait for health
        shell: bash
        run: |
          docker run -d --name solar-storage-minio -p 127.0.0.1:59000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            bitnamilegacy/minio:2025.4.22
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null --max-time 1 "$STORAGE_S3_TEST_ENDPOINT/minio/health/live"; then exit 0; fi
            sleep 1
          done
          docker logs solar-storage-minio
          exit 1
      - run: pnpm --filter @solar/storage test
      - if: failure()
        run: docker logs solar-storage-minio
  db:
    needs: changes
    if: needs.changes.outputs.db == 'true' || needs.changes.outputs.tenant_e2e == 'true' || needs.changes.outputs.turnstile_e2e == 'true' || needs.changes.outputs.preview_e2e == 'true' || needs.changes.outputs.production_e2e == 'true'
    runs-on: ubuntu-24.04 # Playwright 1.58 không cài được trên ubuntu-latest (26.04)
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solar_e5
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solar_e5"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      RLS_REQUIRED: "1"
      E2E_PLATFORM_DOMAIN: solar.example.com
      MEDIA_REQUIRE_FFMPEG: "1"
      STORAGE_REQUIRE_S3: "1"
      STORAGE_S3_TEST_ENDPOINT: http://127.0.0.1:59000
      STORAGE_S3_TEST_ACCESS_KEY_ID: minioadmin
      STORAGE_S3_TEST_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/db-setup
      - name: Install ffmpeg and start MinIO for worker video integration
        if: needs.changes.outputs.db == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          docker run -d --name solar-video-minio -p 127.0.0.1:59000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            bitnamilegacy/minio:2025.4.22
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null --max-time 1 "$STORAGE_S3_TEST_ENDPOINT/minio/health/live"; then exit 0; fi
            sleep 1
          done
          docker logs solar-video-minio
          exit 1
      - if: needs.changes.outputs.db == 'true'
        run: pnpm --filter worker test
      # Second seed proves the seed is idempotent.
      - run: pnpm db:seed
      - if: needs.changes.outputs.db == 'true'
        run: pnpm --filter @solar/db test
      - if: needs.changes.outputs.db == 'true'
        run: pnpm --filter web test:tenant
      - name: Resolve same-site preview and admin hosts in all browser engines
        if: needs.changes.outputs.tenant_e2e == 'true' || needs.changes.outputs.turnstile_e2e == 'true' || needs.changes.outputs.preview_e2e == 'true' || needs.changes.outputs.production_e2e == 'true'
        run: |
          for host in preview-e5-t15 preview-e5-t12 preview-e5-t15.preview preview-e5-t12.preview preview-e5-t15.admin admin-e7-a admin-e7-a.preview admin-e7-a.admin admin-e7-b.admin nang-luong-solar.admin admin-e7-paused.admin missing.admin; do
            echo "127.0.0.1 $host.$E2E_PLATFORM_DOMAIN" | sudo tee -a /etc/hosts
          done
      - uses: actions/cache@v4
        if: needs.changes.outputs.tenant_e2e == 'true' || needs.changes.outputs.turnstile_e2e == 'true' || needs.changes.outputs.preview_e2e == 'true' || needs.changes.outputs.production_e2e == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: needs.changes.outputs.tenant_e2e == 'true' || needs.changes.outputs.turnstile_e2e == 'true' || needs.changes.outputs.preview_e2e == 'true' || needs.changes.outputs.production_e2e == 'true'
        run: pnpm --filter @solar/visual exec playwright install --with-deps chromium webkit firefox
      - if: needs.changes.outputs.tenant_e2e == 'true'
        env:
          GREP: ${{ needs.changes.outputs.tenant_grep }}
          FILES: ${{ needs.changes.outputs.tenant_files }}
        run: pnpm --filter @solar/visual exec playwright test --config playwright.tenant.config.ts $FILES ${GREP:+--grep "$GREP"}
      - name: Turnstile forms (sequential after tenant)
        if: needs.changes.outputs.turnstile_e2e == 'true'
        env:
          GREP: ${{ needs.changes.outputs.turnstile_grep }}
          FILES: ${{ needs.changes.outputs.turnstile_files }}
        run: pnpm --filter @solar/visual exec playwright test --config playwright.turnstile.config.ts $FILES ${GREP:+--grep "$GREP"}
      - if: needs.changes.outputs.preview_e2e == 'true'
        env:
          GREP: ${{ needs.changes.outputs.preview_grep }}
          FILES: ${{ needs.changes.outputs.preview_files }}
        run: pnpm --filter @solar/visual exec playwright test --config playwright.preview.config.ts $FILES ${GREP:+--grep "$GREP"}
      - name: Build tenant production app once
        if: needs.changes.outputs.production_e2e == 'true'
        run: pnpm --filter web build
        env:
          MULTI_TENANT: "1"
      - name: Verify production cache invalidation, isolation, preview and reveal
        if: needs.changes.outputs.production_e2e == 'true'
        env:
          GREP: ${{ needs.changes.outputs.production_grep }}
          FILES: ${{ needs.changes.outputs.production_files }}
        run: pnpm --filter @solar/visual exec playwright test --config playwright.production.config.ts $FILES ${GREP:+--grep "$GREP"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-browser-evidence
          path: |
            tooling/visual/test-results/tenant
            tooling/visual/test-results/turnstile
            tooling/visual/test-results/preview
            tooling/visual/test-results/production
  # Tách khỏi `db` để chạy song song (job `db` trước đây ~17 phút tuần tự).
  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-24.04 # Playwright 1.58 không cài được trên ubuntu-latest (26.04)
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solar_e5
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solar_e5"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      RLS_REQUIRED: "1"
      E2E_PLATFORM_DOMAIN: solar.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/db-setup
      - run: pnpm --filter admin test
      - uses: actions/cache@v4
        if: needs.changes.outputs.admin_e2e == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: needs.changes.outputs.admin_e2e == 'true'
        run: pnpm --filter @solar/visual exec playwright install --with-deps chromium
      - if: needs.changes.outputs.admin_e2e == 'true'
        env:
          GREP: ${{ needs.changes.outputs.admin_grep }}
          FILES: ${{ needs.changes.outputs.admin_files }}
        run: pnpm --filter @solar/visual exec playwright test --config playwright.admin.config.ts --project=chromium $FILES ${GREP:+--grep "$GREP"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-evidence
          path: tooling/visual/test-results/admin
  verify:
    strategy:
      fail-fast: false
      matrix:
        # PR: chỉ Ubuntu (nhanh); Windows chạy khi push lên base để giữ AC đa nền tảng.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # PR: chỉ package đổi so với base + package phụ thuộc vào chúng. Push/dispatch: toàn repo (làm ấm cache).
      # Nhãn `regression`: toàn repo như push/dispatch.
      TURBO_FILTER: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'regression') && format('--filter=...[origin/{0}]', github.base_ref) || '' }}
      # Remote cache tùy chọn: đặt secret TURBO_TOKEN + variable TURBO_TEAM; để trống thì dùng cache .turbo/cache.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: node --version
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm plans:table --check
      - run: node --test scripts/ci/affected.test.mjs scripts/ci/checks-map.test.mjs scripts/ci/visual-intended.test.mjs
      - name: Typecheck and lint (populate cache)
        run: pnpm turbo run typecheck lint lint:root ${TURBO_FILTER:+"$TURBO_FILTER"}
      - name: Typecheck and lint (verify FULL TURBO)
        run: |
          output=$(pnpm turbo run typecheck lint lint:root ${TURBO_FILTER:+"$TURBO_FILTER"} 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          # PR không đụng package nào thì turbo không có task để chạy.
          grep -qE 'FULL TURBO|No tasks were executed' <<< "$output" || {
            echo '::error::The second run must hit the cache for every task.'
            exit 1
          }
      - run: pnpm lint:tokens ${TURBO_FILTER:+"$TURBO_FILTER"}
      - run: pnpm turbo run test build ${TURBO_FILTER:+"$TURBO_FILTER"}
      - name: Core coverage (at least 85% of source lines)
        run: pnpm --filter @solar/core test:coverage
