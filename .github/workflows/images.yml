name: Images

on:
  pull_request:
    branches: [mono-repo-multi-tenent]
    paths:
      - Dockerfile
      - .dockerignore
      - infra/docker/**
      - .github/workflows/images.yml
      - .github/actions/db-setup/**
      - apps/*/next.config.ts
      - apps/*/src/app/api/health/**
      - apps/*/src/lib/health.ts
      - apps/*/src/lib/runtime.ts
      - apps/web/src/lib/tenant/db.ts
      - apps/web/src/lib/tenant/rateLimit.ts
      - apps/*/src/proxy.ts
      - packages/db/src/client.ts
      - packages/db/src/index.ts
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - turbo.json
  push:
    branches: [mono-repo-multi-tenent]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solar_e5
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d solar_e5"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      PLATFORM_DOMAIN: solar.localhost
      LOCAL_IMAGE: solar-${{ matrix.app }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/db-setup
      - name: Throwaway admin session secret
        shell: bash
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "ADMIN_SESSION_SECRET=$secret" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build and load (no publishing before smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha,scope=images-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.app }}
      - name: Smoke read-only image
        run: bash infra/docker/smoke.sh "${{ matrix.app }}" "$LOCAL_IMAGE"
      - name: Registry image name
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mono-repo-multi-tenent'
        shell: bash
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_ENV"
      - name: Login GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mono-repo-multi-tenent'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push GHCR commit SHA
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mono-repo-multi-tenent'
        shell: bash
        run: |
          docker tag "$LOCAL_IMAGE" "ghcr.io/$IMAGE_NAME:$GITHUB_SHA"
          docker push "ghcr.io/$IMAGE_NAME:$GITHUB_SHA"
      - name: AWS credentials (optional OIDC)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mono-repo-multi-tenent' && vars.AWS_ECR_REGISTRY != '' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mono-repo-multi-tenent' && vars.AWS_ECR_REGISTRY != '' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push ECR commit SHA
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mono-repo-multi-tenent' && vars.AWS_ECR_REGISTRY != '' && vars.AWS_ROLE_ARN != ''
        shell: bash
        env:
          ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
        run: |
          repo=${IMAGE_NAME#*/}
          docker tag "$LOCAL_IMAGE" "$ECR_REGISTRY/$repo:$GITHUB_SHA"
          docker push "$ECR_REGISTRY/$repo:$GITHUB_SHA"
