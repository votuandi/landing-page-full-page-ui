name: Visual regression

on:
  push:
    branches: [mono-repo-multi-tenent]
    paths:
      - 'apps/web/**'
      - 'packages/config/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'packages/sections/**'
      - 'packages/themes/**'
      - 'packages/tokens/**'
      - 'packages/presets/**'
      - 'tooling/visual/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/visual.yml'
      - 'scripts/ci/checks-map.mjs'
      - 'scripts/ci/visual-baseline-run.sh'
      - '!**/*.md'
  # PR: không lọc paths — job `changes` chọn compare/matrix; story regression (nhãn) cần chạy dù không đổi giao diện.
  pull_request:
    branches: [mono-repo-multi-tenent]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Bộ kiểm theo file đổi (scripts/ci/checks-map.mjs, cùng bảng với /run-story): matrix chỉ chạy khi đầu vào của nó đổi.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.map.outputs.matrix }}
      visual: ${{ steps.map.outputs.visual }}
      sections_e2e: ${{ steps.map.outputs.sections_e2e }}
      sections_grep: ${{ steps.map.outputs.sections_grep }}
      sections_files: ${{ steps.map.outputs.sections_files }}
      full: ${{ steps.map.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: map
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          # Story regression (nhãn PR `regression`, routing.json regressionEvery) hoặc chạy tay → toàn bộ.
          FULL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'regression') }}
        run: |
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          # workflow_dispatch, push đầu tiên hoặc before không còn → chạy đủ.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then printf 'matrix=true\nvisual=true\nsections_e2e=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          args=(); [ "$FULL" = true ] && args=(--full)
          node scripts/ci/checks-map.mjs "$BASE" --github-output "${args[@]}"

  baseline:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mono-repo-multi-tenent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: visual-chromium-${{ runner.os }}-${{ hashFiles('tooling/visual/package.json') }}
      - run: pnpm --filter @solar/visual exec playwright install --with-deps chromium
      - run: pnpm visual:update
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baseline
          path: tooling/visual/__screenshots__/linux
          retention-days: 90
          if-no-files-found: error

  # Story thường: ảnh trang công khai khi đầu vào của nó đổi + chỉ test sections mới/sửa; regression: toàn bộ.
  compare:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.visual == 'true' || needs.changes.outputs.sections_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: visual-chromium-${{ runner.os }}-${{ hashFiles('tooling/visual/package.json') }}
      - run: pnpm --filter @solar/visual exec playwright install --with-deps chromium
      - name: Download base baseline, or generate at merge-base
        if: needs.changes.outputs.visual == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          snapshot_dir="$GITHUB_WORKSPACE/tooling/visual/__screenshots__/linux"
          merge_base=$(git merge-base HEAD "origin/$BASE_REF")
          # Latest successful base run with identical visual inputs (docs-only commits do not run visual.yml).
          run_id=$(bash scripts/ci/visual-baseline-run.sh "$merge_base") || run_id=""
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name visual-baseline --dir "$snapshot_dir"; then
            echo "Baseline restored from run $run_id"
          else
            echo '::notice::Baseline unavailable/expired; generating from merge-base with the PR harness.'
            # Remove any partial download before generating a complete baseline.
            rm -rf "$snapshot_dir"
            baseline_root="$RUNNER_TEMP/visual-base"
            git worktree add --detach "$baseline_root" "$merge_base"
            (
              cd "$baseline_root"
              pnpm install --frozen-lockfile
              pnpm --filter @solar/db generate
              # Match the PR's compiler while keeping merge-base source unchanged.
              pnpm --filter web exec next build --webpack
            )
            # merge-base may predate tooling/visual; keep its dependencies/source untouched.
            VISUAL_WEB_ROOT="$baseline_root" pnpm --filter @solar/visual visual:update
            test -n "$(find "$snapshot_dir" -name '*.png' -print -quit)"
          fi
      # `@quarantine`: test flaky đã biết (tooling/visual/README.md), chỉ chạy ở regression.
      - if: needs.changes.outputs.visual == 'true'
        shell: bash
        run: pnpm visual:test ${{ needs.changes.outputs.full != 'true' && '--grep-invert @quarantine' || '' }}
      # visual:test đã build web; chỉ chạy sections thì build ở đây (test:sections dùng `next start`).
      - if: needs.changes.outputs.visual != 'true' && needs.changes.outputs.sections_e2e == 'true'
        run: pnpm turbo run build --filter=web
      - if: needs.changes.outputs.sections_e2e == 'true'
        shell: bash
        env:
          GREP: ${{ needs.changes.outputs.sections_grep }}
          FILES: ${{ needs.changes.outputs.sections_files }}
        run: pnpm --filter @solar/visual test:sections $FILES ${GREP:+--grep "$GREP"}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: |
            tooling/visual/playwright-report
            tooling/visual/test-results
          retention-days: 14
          if-no-files-found: warn

  matrix:
    needs: changes
    if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/mono-repo-multi-tenent') && needs.changes.outputs.matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [matrix-mobile-390-light, matrix-mobile-390-dark, matrix-desktop-1440-light, matrix-desktop-1440-dark]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: visual-chromium-${{ runner.os }}-${{ hashFiles('tooling/visual/package.json') }}
      - run: pnpm --filter @solar/visual exec playwright install --with-deps chromium
      - name: Restore complete matrix baseline or generate this shard at exact base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          snapshot_dir="$GITHUB_WORKSPACE/tooling/visual/__screenshots__/linux"
          merge_base=$(git merge-base HEAD "origin/$BASE_REF")
          # Latest successful base run with identical visual inputs (docs-only commits do not run visual.yml).
          run_id=$(bash scripts/ci/visual-baseline-run.sh "$merge_base" matrix-baseline) || run_id=""
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name matrix-baseline --dir "$snapshot_dir" && \
            node tooling/visual/matrix-baseline.js "$snapshot_dir"; then
            echo "Complete matrix baseline restored from run $run_id"
          else
            echo '::notice::Matrix baseline unavailable/incomplete; generating the exact-base shard.'
            rm -rf "$snapshot_dir"
            baseline_root="$RUNNER_TEMP/matrix-base"
            git worktree add --detach "$baseline_root" "$merge_base"
            (
              cd "$baseline_root"
              pnpm install --frozen-lockfile
              pnpm --filter @solar/db generate
              pnpm --filter web exec next build --webpack
            )
            VISUAL_WEB_ROOT="$baseline_root" pnpm --filter @solar/visual matrix:update \
              --project=${{ matrix.project }} --shard=${{ matrix.shard }}/8
          fi
      - run: pnpm turbo run build --filter=web
      - name: Generate baseline shard (budget 6 minutes)
        if: github.event_name != 'pull_request'
        run: pnpm --filter @solar/visual matrix:update --project=${{ matrix.project }} --shard=${{ matrix.shard }}/8
        timeout-minutes: 6
      - name: Compare section shard (budget 6 minutes)
        if: github.event_name == 'pull_request'
        run: pnpm --filter @solar/visual matrix:test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/8
        timeout-minutes: 6
      - run: pnpm --filter @solar/visual matrix:report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            tooling/visual/matrix-report
            tooling/visual/test-results/matrix
            tooling/visual/test-results/matrix-run.json
            tooling/visual/playwright-report
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request'
        with:
          name: matrix-baseline-${{ matrix.project }}-${{ matrix.shard }}
          path: tooling/visual/__screenshots__/linux
          retention-days: 1
          if-no-files-found: error

  matrix-baseline:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mono-repo-multi-tenent'
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: matrix-baseline-*
          merge-multiple: true
          path: tooling/visual/__screenshots__/linux
      - run: node tooling/visual/matrix-baseline.js tooling/visual/__screenshots__/linux
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-baseline
          path: tooling/visual/__screenshots__/linux
          retention-days: 90
          if-no-files-found: error
